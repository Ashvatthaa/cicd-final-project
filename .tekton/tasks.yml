apiVersion: tekton.dev/v1beta1
kind: Pipeline
metadata:
  name: cicd-final-pipeline
spec:
  workspaces:
    - name: shared-workspace
  tasks:
    - name: cleanup
      taskRef:
        name: cleanup-task
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: test
      taskRef:
        name: test-task
      runAfter:
        - cleanup
      workspaces:
        - name: source
          workspace: shared-workspace

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: cleanup-task
spec:
  workspaces:
    - name: source
  steps:
    - name: clean-workspace
      image: alpine:latest
      script: |
        #!/bin/sh
        echo "Cleaning up workspace directory..."
        rm -rf $(workspaces.source.path)/*
        rm -rf $(workspaces.source.path)/.[!.]*

---
apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: test-task
spec:
  workspaces:
    - name: source
  steps:
    - name: run-tests
      image: node:20-alpine
      workingDir: $(workspaces.source.path)
      script: |
        npm install
        npm test